<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Dialog with no divider below the header and none above the footer">
  <rect width="520" height="340" fill="#f1efe9"/>
  <rect x="30" y="26" width="460" height="288" rx="10" fill="#ffffff" stroke="#e0ddd6"/>

  <text x="54" y="66" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#262624">Receive via Supplier Portal</text>
  <text x="54" y="88" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8a8783">Invite a supplier to upload documents directly</text>

  <!-- no divider here: this is the defect -->
  <text x="54" y="128" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8a8783">SUPPLIER EMAIL</text>
  <rect x="54" y="138" width="412" height="34" rx="6" fill="#fff" stroke="#ddd9d1"/>
  <text x="66" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b8b4ac">supplier@example.com</text>

  <text x="54" y="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8a8783">MESSAGE</text>
  <rect x="54" y="210" width="412" height="46" rx="6" fill="#fff" stroke="#ddd9d1"/>

  <!-- no divider here either -->
  <rect x="318" y="272" width="72" height="30" rx="6" fill="#fff" stroke="#ddd9d1"/>
  <text x="338" y="292" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#262624">Cancel</text>
  <rect x="398" y="272" width="68" height="30" rx="6" fill="#1f2a37"/>
  <text x="418" y="292" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff">Send</text>

  <g stroke="#c8322f" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <rect x="42" y="96" width="436" height="16" rx="3"/>
    <rect x="42" y="258" width="436" height="16" rx="3"/>
  </g>
  <text x="486" y="108" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#c8322f">no header divider</text>
  <text x="486" y="270" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#c8322f">no footer divider</text>
</svg>
