<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Dialog with a divider below the header, a divider above the footer, and right-aligned buttons">
  <rect width="520" height="340" fill="#f1efe9"/>
  <rect x="30" y="26" width="460" height="288" rx="10" fill="#ffffff" stroke="#e0ddd6"/>

  <text x="54" y="66" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#262624">Upload by email</text>
  <text x="54" y="88" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8a8783">Your own dedicated email to send the documents</text>

  <line x1="30" y1="104" x2="490" y2="104" stroke="#e0ddd6" stroke-width="1.5"/>

  <text x="54" y="140" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8a8783">DEDICATED ADDRESS</text>
  <rect x="54" y="150" width="412" height="34" rx="6" fill="#fff" stroke="#ddd9d1"/>
  <text x="66" y="172" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#262624">docs-4417@inbox.mydost.ai</text>

  <rect x="54" y="200" width="412" height="46" rx="6" fill="#fbfaf7" stroke="#ece9e2"/>
  <text x="66" y="228" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8a8783">Anything sent here is ingested automatically.</text>

  <line x1="30" y1="262" x2="490" y2="262" stroke="#e0ddd6" stroke-width="1.5"/>

  <rect x="398" y="274" width="68" height="30" rx="6" fill="#1f2a37"/>
  <text x="420" y="294" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff">Close</text>

  <g stroke="#2c6b2c" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <rect x="42" y="96" width="436" height="16" rx="3"/>
    <rect x="42" y="254" width="436" height="16" rx="3"/>
  </g>
  <text x="486" y="108" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2c6b2c">header divider</text>
  <text x="486" y="266" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2c6b2c">footer divider</text>
</svg>
